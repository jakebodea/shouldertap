# Reusable native gates; Deploy includes every result in required verification.
name: Native

on:
  workflow_call:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: ShouldertapCore tests
        run: cd apps/macos && swift test

  # The Release workflow packages on this runner image; check the DMG still
  # builds (Finder lays out its window over AppleScript) before a release
  # depends on it. Ad-hoc signed, nothing uploaded, no keys.
  mac-package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Package the DMG
        run: DEVELOPER_DIR="$(xcode-select -p)" scripts/release-mac.sh --no-upload

  # Compile the iPhone app (and its widget extension) so Swift that only the
  # Release archive would build fails here instead of after merge. Unsigned,
  # nothing uploaded, no keys.
  ios-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build ShouldertapIOS
        run: |
          DEVELOPER_DIR="$(xcode-select -p)"
          export DEVELOPER_DIR
          xcodebuild build -quiet \
            -project apps/ios/Shouldertap.xcodeproj -scheme ShouldertapIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # GPUI app deps do not build on Linux; protocol tests live in core only.
      - name: shouldertap-core tests
        run: cd apps/windows && cargo test -p shouldertap-core
