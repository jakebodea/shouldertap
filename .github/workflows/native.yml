# Swift and Rust protocol mirrors: run when native or shared contracts change.
name: Native

on:
  pull_request:
    paths:
      - "packages/domain/**"
      - "apps/server/**"
      - "apps/macos/**"
      - "apps/ios/**"
      - "apps/windows/**"
      - "scripts/check-protocol-sync.ts"
      - "scripts/release-mac.sh"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - "packages/domain/**"
      - "apps/server/**"
      - "apps/macos/**"
      - "apps/ios/**"
      - "apps/windows/**"
      - "scripts/check-protocol-sync.ts"

jobs:
  swift:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: ShouldertapCore tests
        run: cd apps/macos && swift test

  # The Release workflow packages on this runner image; check the DMG still
  # builds (Finder lays out its window over AppleScript) before a release
  # depends on it. Ad-hoc signed, nothing uploaded, no keys.
  mac-package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Package the DMG
        run: DEVELOPER_DIR="$(xcode-select -p)" scripts/release-mac.sh --no-upload

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # GPUI app deps do not build on Linux; protocol tests live in core only.
      - name: shouldertap-core tests
        run: cd apps/windows && cargo test -p shouldertap-core
