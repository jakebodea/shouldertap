# Uploads the iOS app to TestFlight when a pull request labeled release:beta
# lands on main, or on demand (Actions > TestFlight > Run workflow). It runs on
# the push to main rather than on the PR, so it builds exactly what merged and
# Infisical (shouldertap-prod, through the main-only `production` environment)
# hands it the App Store Connect key.
name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  # Most pushes carry no release:beta label, so the lookup runs on Linux and the macOS job
  # starts only when there is something to upload.
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.pr.outputs.release }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Find the merged pull request
        id: pr
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(any(.labels[]; .name == "release:beta"))][0].number // empty')
          if [ -n "$pr" ]; then
            echo "Releasing #$pr"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "number=$pr" >> "$GITHUB_OUTPUT"
          else
            echo "No release:beta pull request for ${{ github.sha }}; nothing to release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: find
    if: needs.find.outputs.release == 'true'
    runs-on: macos-26
    # ci-prod only trusts jobs in this environment, which only main may use,
    # so a run dispatched from another branch stops here.
    environment: production
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Load the App Store Connect key
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          domain: https://app.infisical.com
          project-slug: shouldertap-qp-dq
          env-slug: prod

      - name: Archive and upload
        id: upload
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          export DEVELOPER_DIR="$(xcode-select -p)"
          xcodebuild -version
          scripts/release-ios.sh
          build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' apps/ios/build/release/Shouldertap.xcarchive/Products/Applications/Shouldertap.app/Info.plist)
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Comment on the pull request
        if: always() && needs.find.outputs.number != ''
        run: |
          if [ "${{ steps.upload.outcome }}" = success ]; then
            body="Uploaded build ${{ steps.upload.outputs.build }} to App Store Connect. It shows up in TestFlight after processing (usually 5-15 minutes)."
          else
            body="TestFlight upload failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          gh pr comment ${{ needs.find.outputs.number }} --repo ${{ github.repository }} --body "$body"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
