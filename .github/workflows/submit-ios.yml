# Submits an uploaded iOS build for App Review (Actions > Submit iOS for
# review > Run workflow). The build must already be in TestFlight, uploaded
# by release.yml. scripts/submit-ios.ts makes or reuses the App Store version,
# attaches the build, sets What's New and submits. With "screenshots" it first
# replaces the iPhone screenshots with brand/app-store's exports (see its
# README); otherwise they and the description stay as they are.
name: Submit iOS for review

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.1"
        required: true
      build:
        description: "Build number, e.g. 11"
        required: true
      whats_new:
        description: "What's New in this version"
        required: true
      release:
        description: "Release when approved, or wait for a manual release"
        type: choice
        options: [after-approval, manual]
        default: after-approval
      screenshots:
        description: "Replace the iPhone screenshots with brand/app-store/exports"
        type: boolean
        default: false
      submit:
        description: "Submit for review (off: prepare the version only, to check it in App Store Connect)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ci-prod only trusts jobs in this environment, which only main may use.
    environment: production
    concurrency: { group: submit-ios, cancel-in-progress: false }
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - name: Load the App Store Connect key
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          domain: https://app.infisical.com
          project-slug: shouldertap-qp-dq
          env-slug: prod

      - name: Prepare and submit for App Review
        run: |
          args=(--version "$VERSION" --build "$BUILD" --whats-new "$WHATS_NEW" --release "$RELEASE")
          if [ "$SCREENSHOTS" = true ]; then args+=(--screenshots brand/app-store); fi
          if [ "$SUBMIT" != true ]; then args+=(--no-submit); fi
          bun scripts/submit-ios.ts "${args[@]}"
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          WHATS_NEW: ${{ inputs.whats_new }}
          RELEASE: ${{ inputs.release }}
          SCREENSHOTS: ${{ inputs.screenshots }}
          SUBMIT: ${{ inputs.submit }}
