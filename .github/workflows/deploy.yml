# Pushes to main deploy prod; pull requests deploy a pr-<number> preview.
# preview-cleanup.yml destroys closed PRs. Cloudflare credentials come from
# stacks/github.ts; app secrets for prod come from the Infisical project
# shouldertap-prod, which alchemy.run.ts loads (see stacks/secrets.ts).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

env:
  STAGE: >-
    ${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || (github.ref == 'refs/heads/main' && 'prod' || github.ref_name) }}

jobs:
  # Which gates this PR's changed files can affect (stacks/affected.ts): docs
  # skip everything but `check`, web-only skips native, native-only skips the
  # browser, e2e and preview gates. Pushes to main always run every gate.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.affected.outputs.native }}
      web: ${{ steps.affected.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            stacks/affected.ts
            package.json
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Classify changed files
        id: affected
        run: |
          if [ "$EVENT" = pull_request ]; then
            gh api --paginate "repos/$REPO/pulls/$PULL_REQUEST/files?per_page=100" \
              --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
          else
            : > "$RUNNER_TEMP/files.txt"
          fi
          bun stacks/affected.ts < "$RUNNER_TEMP/files.txt" | tee -a "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.number }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A new push to a PR cancels its older checks; main runs always finish.
    concurrency:
      group: check-${{ github.event.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Vitest and Oxlint's JS plugins run on Node.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check-types
      # Unit tests only: the server's integration test deploys a stack and runs after the preview deploy.
      - run: bun run test

  # Runs beside `check` in Playwright's image, which already has WebKit and its system
  # libraries. `playwright install --with-deps` fetched those from Ubuntu's mirror on every run:
  # under a minute usually, but up to 36 minutes when the mirror crawled.
  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: e2e-${{ github.event.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    container:
      # Keep in step with @playwright/test in bun.lock; the first step fails if they differ.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v5
      # The image has Node but not unzip, which setup-bun needs, so Bun comes from npm.
      - name: Install Bun
        run: npm install --global "bun@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile
      - name: Match the image to the installed Playwright
        working-directory: apps/web
        run: |
          installed=$(node -p 'require("@playwright/test/package.json").version')
          if [ "$installed" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::@playwright/test is $installed but the e2e image is $PLAYWRIGHT_VERSION; update both in deploy.yml."
            exit 1
          fi
      - name: Download flow tests
        working-directory: apps/web
        run: bun run test:e2e --workers=3
      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: download-report
          path: apps/web/playwright-report/

  # main -> prod. The only job with the `production` environment, so the only
  # one ci-prod trusts: Alchemy logs in to Infisical with this job's OIDC token
  # and loads shouldertap-prod (stacks/secrets.ts).
  deploy:
    needs: verification
    # verification runs with always(), so the implicit success() here would
    # also see preview's push-time skip and skip prod. Gate on its result.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.verification.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: shouldertap-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Deploy
        run: |
          bun alchemy provider check-env --provider Cloudflare
          bun alchemy deploy --stage prod --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_OIDC_AUDIENCE: ${{ vars.INFISICAL_OIDC_AUDIENCE }}

  # Each PR -> pr-<number>. No environment and no OIDC token: previews read
  # nothing from Infisical.
  preview:
    needs: [check, e2e]
    # Fork PRs get no secrets, so they're checked but not previewed.
    if: >-
      github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Cleanup uses this same group.
    concurrency:
      group: shouldertap-pr-${{ github.event.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Deploy
        id: deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Provision CLOUDFLARE_TEST_API_TOKEN and CLOUDFLARE_TEST_ACCOUNT_ID; production credentials are never a fallback."
            exit 1
          fi
          bun alchemy provider check-env --provider Cloudflare
          allowed=$(bun scripts/cloudflare/preview-gate.ts deploy)
          if [ "$allowed" != true ]; then
            echo "Preview skipped: PR is closed or this run is no longer the current head."
            exit 0
          fi
          COMMIT_SHA="$(git rev-parse HEAD)"
          export COMMIT_SHA
          bun alchemy deploy --stage "$STAGE" --yes
          echo "deployed=true" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_TEST_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
          # COMMIT_SHA is set from the actual checkout, not the PR branch label.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      # Drives the protocol against the preview just deployed. Not run on prod,
      # where it would leave test inboxes behind.
      - name: Preview URL
        id: preview
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          # In CI the CLI logs to stdout too, so keep only the JSON record.
          STACK_URL=$(bun alchemy state cat shouldertap/${{ env.STAGE }}/output --no-input \
            | sed -n '/^{/,/^}/p' | jq -re .server)
          echo "server=$STACK_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_TEST_ACCOUNT_ID }}
      - name: Preview protocol smoke
        id: integration
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          echo "Testing $STACK_URL"
          EXPECTED_REVISION="$(git rev-parse HEAD)" bun scripts/verification/preview-smoke.ts
        env:
          STACK_URL: ${{ steps.preview.outputs.server }}
    outputs:
      server: ${{ steps.preview.outputs.server }}
      verified: ${{ steps.deploy.outputs.deployed == 'true' && steps.integration.outcome == 'success' }}

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read

  verify-browser:
    # Fork code never receives cloud credentials. The aggregate refuses to
    # treat that safe skip as verified; a maintainer must use a trusted branch.
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true'
        && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
      CLOUDFLARE_TEST_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
      CLOUDFLARE_TEST_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_TEST_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require isolated test credentials
        run: |
          if [ -z "$CLOUDFLARE_TEST_API_TOKEN" ] || [ -z "$CLOUDFLARE_TEST_ACCOUNT_ID" ]; then
            echo "::error::Provision CLOUDFLARE_TEST_API_TOKEN and CLOUDFLARE_TEST_ACCOUNT_ID; production credentials are never a fallback."
            exit 1
          fi
      - name: Install Bun
        run: npm install --global "bun@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile
      - name: Match browser image to lockfile
        working-directory: apps/web
        run: test "$(node -p 'require("@playwright/test/package.json").version')" = 1.63.0
      # checkout's temporary HOME differs from the container runtime HOME.
      # Trust only this mounted checkout before the runner inspects its revision.
      - name: Trust the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify real hosted browser journey
        run: bun run verify -- --hosted --scenario browser
      - name: Retain public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  verification:
    if: always()
    needs: [changes, check, e2e, preview, native, verify-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            stacks/verification-policy.ts
            package.json
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Require all applicable verification results
        run: bun stacks/verification-policy.ts
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          CHANGES: ${{ needs.changes.result }}
          NATIVE_AFFECTED: ${{ needs.changes.outputs.native }}
          WEB_AFFECTED: ${{ needs.changes.outputs.web }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          NATIVE: ${{ needs.native.result }}
          BROWSER: ${{ needs.verify-browser.result }}
          PREVIEW: ${{ needs.preview.result }}
          PREVIEW_VERIFIED: ${{ needs.preview.outputs.verified }}
