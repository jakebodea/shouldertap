# Pushes to main deploy prod; pull requests deploy a pr-<number> preview.
# preview-cleanup.yml destroys closed PRs. Cloudflare credentials come from
# stacks/github.ts; app secrets for prod come from Infisical.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

env:
  STAGE: >-
    ${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || (github.ref == 'refs/heads/main' && 'prod' || github.ref_name) }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A new push to a PR cancels its older checks; main runs always finish.
    concurrency:
      group: check-${{ github.event.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Vitest and Oxlint's JS plugins run on Node.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check-types
      # Unit tests only: the server's integration test deploys a stack and runs after the preview deploy.
      - run: bun run test

  # Runs beside `check` in Playwright's image, which already has WebKit and its system
  # libraries. `playwright install --with-deps` fetched those from Ubuntu's mirror on every run:
  # under a minute usually, but up to 36 minutes when the mirror crawled.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: e2e-${{ github.event.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    container:
      # Keep in step with @playwright/test in bun.lock; the first step fails if they differ.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v5
      # The image has Node but not unzip, which setup-bun needs, so Bun comes from npm.
      - name: Install Bun
        run: npm install --global "bun@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
      - run: bun install --frozen-lockfile
      - name: Match the image to the installed Playwright
        working-directory: apps/web
        run: |
          installed=$(node -p 'require("@playwright/test/package.json").version')
          if [ "$installed" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::@playwright/test is $installed but the e2e image is $PLAYWRIGHT_VERSION; update both in deploy.yml."
            exit 1
          fi
      - name: Download flow tests
        working-directory: apps/web
        run: bun run test:e2e --workers=3
      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: download-report
          path: apps/web/playwright-report/

  deploy:
    needs: [check, e2e]
    # Fork PRs get no secrets, so they're checked but not previewed.
    if: >-
      (github.event_name == 'push'
        || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Cleanup uses this same group, including when a PR merges into main.
    concurrency:
      group: shouldertap-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      # Infisical authenticates this job by its GitHub OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Prod's app secrets (SUPPORT_FORWARD_TO, ...) as env vars for the
      # deploy. The identity only trusts main, so previews never see them.
      - name: Load prod secrets
        if: env.STAGE == 'prod'
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/jakebodea
          domain: https://app.infisical.com
          project-slug: shouldertap-qp-dq
          env-slug: prod
      - name: Deploy
        id: deploy
        run: |
          bun alchemy provider check-env --provider Cloudflare
          if [ "$STAGE" != prod ]; then
            allowed=$(bun scripts/cloudflare/preview-gate.ts deploy)
            if [ "$allowed" != true ]; then
              echo "Preview skipped: PR is closed or this run is no longer the current head."
              exit 0
            fi
          fi
          bun alchemy deploy --stage "$STAGE" --yes
          echo "deployed=true" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
          # On PRs github.sha is the temporary merge commit, not the branch head.
          # (Actions won't let a step override GITHUB_SHA itself.)
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      # Drives the protocol against the preview just deployed. Not run on prod,
      # where it would leave test inboxes behind.
      - name: Preview URL
        id: preview
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployed == 'true'
        run: |
          # In CI the CLI logs to stdout too, so keep only the JSON record.
          STACK_URL=$(bun alchemy state cat shouldertap/${{ env.STAGE }}/output --no-input \
            | sed -n '/^{/,/^}/p' | jq -re .server)
          echo "server=$STACK_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Integration tests
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployed == 'true'
        run: |
          echo "Testing $STACK_URL"
          cd apps/server && bun run test:integ
        env:
          STACK_URL: ${{ steps.preview.outputs.server }}
    outputs:
      server: ${{ steps.preview.outputs.server }}
