# Pushes to main deploy prod; pull requests deploy a pr-<number> preview,
# destroyed when the PR closes. Credentials come from stacks/github.ts.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE: >-
    ${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || (github.ref == 'refs/heads/main' && 'prod' || github.ref_name) }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check-types
      - name: Install browser test engines
        working-directory: apps/web
        run: bunx playwright install --with-deps webkit chromium
      - name: Mobile frame regression tests
        working-directory: apps/web
        run: bun run test:e2e --workers=3
      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-frame-report
          path: apps/web/playwright-report/

  deploy:
    needs: check
    # Fork PRs get no secrets, so they're checked but not previewed.
    if: >-
      github.event.action != 'closed'
      && (github.event_name == 'push'
        || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Deploy
        run: |
          bun alchemy provider check-env --provider Cloudflare
          bun alchemy deploy --stage ${{ env.STAGE }} --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
          # On PRs github.sha is the temporary merge commit, not the branch head.
          # (Actions won't let a step override GITHUB_SHA itself.)
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Drives the protocol against the preview just deployed. Not run on prod,
      # where it would leave test inboxes behind.
      - name: Integration tests
        if: github.event_name == 'pull_request'
        run: |
          # In CI the CLI logs to stdout too, so keep only the JSON record.
          STACK_URL=$(bun alchemy state cat shouldertap/${{ env.STAGE }}/output --no-input \
            | sed -n '/^{/,/^}/p' | jq -re .server)
          echo "Testing $STACK_URL"
          cd apps/server && STACK_URL=$STACK_URL bun test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Safety check
        run: |
          if [ "${{ env.STAGE }}" = "prod" ]; then
            echo "ERROR: Cannot destroy prod environment in cleanup job"
            exit 1
          fi
      - name: Destroy preview
        run: bun alchemy destroy --stage ${{ env.STAGE }} --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
