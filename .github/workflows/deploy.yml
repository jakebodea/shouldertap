# Pushes to main deploy prod; pull requests deploy a pr-<number> preview,
# destroyed when the PR closes. Cloudflare credentials come from
# stacks/github.ts; app secrets for prod come from Infisical.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE: >-
    ${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || (github.ref == 'refs/heads/main' && 'prod' || github.ref_name) }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check-types
      - name: Install browser test engines
        working-directory: apps/web
        run: bunx playwright install --with-deps webkit
      - name: Download flow tests
        working-directory: apps/web
        run: bun run test:e2e --workers=3
      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: download-report
          path: apps/web/playwright-report/

  deploy:
    needs: check
    # Fork PRs get no secrets, so they're checked but not previewed.
    if: >-
      github.event.action != 'closed'
      && (github.event_name == 'push'
        || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Infisical authenticates this job by its GitHub OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Prod's app secrets (SUPPORT_FORWARD_TO, ...) as env vars for the
      # deploy. The identity only trusts main, so previews never see them.
      - name: Load prod secrets
        if: env.STAGE == 'prod'
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/jakebodea
          domain: https://app.infisical.com
          project-slug: shouldertap-qp-dq
          env-slug: prod
      - name: Deploy
        run: |
          bun alchemy provider check-env --provider Cloudflare
          bun alchemy deploy --stage ${{ env.STAGE }} --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
          # On PRs github.sha is the temporary merge commit, not the branch head.
          # (Actions won't let a step override GITHUB_SHA itself.)
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Drives the protocol against the preview just deployed. Not run on prod,
      # where it would leave test inboxes behind.
      - name: Preview URL
        id: preview
        if: github.event_name == 'pull_request'
        run: |
          # In CI the CLI logs to stdout too, so keep only the JSON record.
          STACK_URL=$(bun alchemy state cat shouldertap/${{ env.STAGE }}/output --no-input \
            | sed -n '/^{/,/^}/p' | jq -re .server)
          echo "server=$STACK_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Integration tests
        if: github.event_name == 'pull_request'
        run: |
          echo "Testing $STACK_URL"
          cd apps/server && bun test
        env:
          STACK_URL: ${{ steps.preview.outputs.server }}
    outputs:
      server: ${{ steps.preview.outputs.server }}

  # The Windows app on a real Windows desktop against the preview: pairs it,
  # sends taps, answers with the keyboard, and keeps screenshots. Only when
  # something it depends on changed.
  windows-smoke:
    needs: deploy
    if: github.event_name == 'pull_request' && needs.deploy.outputs.server != ''
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Changed?
        id: changed
        shell: bash
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- apps/windows apps/server packages/domain \
            apps/macos/Tests/ShouldertapCoreTests/Fixtures .github/workflows/deploy.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
        with:
          workspaces: apps/windows
      - name: Build (dev build, so it can point at the preview)
        if: steps.changed.outputs.run == 'true'
        working-directory: apps/windows
        run: cargo build -p shouldertap
      - name: Smoke test
        if: steps.changed.outputs.run == 'true'
        working-directory: apps/windows
        run: ./scripts/smoke.ps1 -Server "${{ needs.deploy.outputs.server }}" -Exe target\debug\Shouldertap.exe -Out smoke
      - name: Screenshots and logs
        if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke
          path: apps/windows/smoke/

  cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Safety check
        run: |
          if [ "${{ env.STAGE }}" = "prod" ]; then
            echo "ERROR: Cannot destroy prod environment in cleanup job"
            exit 1
          fi
      - name: Destroy preview
        run: bun alchemy destroy --stage ${{ env.STAGE }} --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
