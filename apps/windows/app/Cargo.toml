[package]
name = "shouldertap"
description = "Shouldertap for Windows: the tray app that puts taps on every display"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "Shouldertap"
path = "src/main.rs"

[dependencies]
shouldertap-core = { path = "../core" }
# Zed's UI framework. No default features: this app embeds its own manifest
# (build.rs), and Linux isn't a target yet. `runtime_shaders` only affects
# macOS, where the app runs for development without Xcode's Metal toolchain.
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
futures = "0.3"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", default-features = false, features = ["native-tls", "json"] }
anyhow = "1"
sha2 = "0.10"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_Storage_FileSystem",
] }

[build-dependencies]
embed-resource = "3"
