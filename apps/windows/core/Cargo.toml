[package]
name = "shouldertap-core"
description = "Shouldertap's receiver: contracts, API client, live socket and store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
# HTTPS and WebSocket over the system's TLS (SChannel on Windows), so they
# respect its certificate store and add no TLS stack of their own.
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }
tungstenite = { version = "0.28", features = ["native-tls"] }
native-tls = "0.2"
