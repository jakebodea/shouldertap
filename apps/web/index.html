<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
      name="viewport"
    >
    <meta
      content="#f6f5f1"
      media="(prefers-color-scheme: light)"
      name="theme-color"
    >
    <meta
      content="#18181a"
      media="(prefers-color-scheme: dark)"
      name="theme-color"
    >
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="Shouldertap" name="apple-mobile-web-app-title">
    <link href="/icon.svg" rel="icon" type="image/svg+xml">
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180">
    <link href="/icon-192.png" rel="icon" sizes="192x192" type="image/png">
    <title>Shouldertap</title>
    <!--
      Link previews (iMessage, Slack, X) never run the app, so they read these
      static tags. Regenerate the image with `bun run render:share-images`.
    -->
    <meta
      content="When someone at home needs you, their message covers your Mac until you answer. They see your reply the moment you send it."
      name="description"
    >
    <meta content="website" property="og:type">
    <meta content="Shouldertap" property="og:site_name">
    <meta content="Shouldertap" property="og:title">
    <meta
      content="When someone at home needs you, their message covers your Mac until you answer. They see your reply the moment you send it."
      property="og:description"
    >
    <meta content="https://shouldertap.app/" property="og:url">
    <meta content="https://shouldertap.app/og-image.png" property="og:image">
    <meta content="image/png" property="og:image:type">
    <meta content="1200" property="og:image:width">
    <meta content="630" property="og:image:height">
    <meta
      content="A message from Alex, “Can you come here?”, with the replies On it, In 10 min and Reply."
      property="og:image:alt"
    >
    <meta content="summary_large_image" name="twitter:card">
  </head>

  <body>
    <div id="app"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
